# Test Data Configuration for People Directory Tests
# Externalized test data to eliminate hardcoded values in test code

# Test Configuration
test.offline.mode=false
test.connectivity.timeout=10000
test.retry.attempts=3
test.skip.on.connectivity.failure=true

# Base URLs
directory.base.url=https://www.uci.cu/index.php/directorio/personas
universities.base.url=https://www.uci.cu/index.php/directorio/universidades
phones.base.url=https://www.uci.cu/index.php/directorio/telefonos

# Expected Page Titles and Headers
directory.page.title=Directorio | Universidad de las Ciencias Informáticas
directory.section.header=Personas
universities.page.title=Directorio
universities.section.header=Universidades
phones.page.title=Directorio
phones.section.header=Teléfonos

# Expected Person Names for Validation
expected.person.name.1=Abel Velázquez Pratts
expected.person.name.2=Ada Isabel Llaneras Pulido
expected.person.name.3=Adolfo José Quesada Guanche
expected.person.name.4=Adriana María González Pérez
expected.person.name.5=Agustín Vidal Rodríguez

# Empty State Messages
empty.state.message.no.results=no hay resultados
empty.state.message.no.data=No data
empty.state.message.empty=No results found

# Alphabet Filter Test Data
alphabet.letters=A,B,C,D,E,F,G,H,I,J,K,L,M,N,Ñ,O,P,Q,R,S,T,U,V,W,X,Y,Z
special.characters=Ñ

# Performance Thresholds (in milliseconds)
performance.threshold.page.load=3000
performance.threshold.filter.response=2000
performance.threshold.pagination.load=1500

# Pagination Test Data
pagination.default.page.size=20
pagination.max.pages=10

# Search Test Data
search.valid.term=Juan
search.invalid.term=XYZ123
search.empty.term=

# Accessibility Test Data
accessibility.contrast.ratio.minimum=4.5
accessibility.alt.text.required=true

# Browser Configuration
browser.default=chrome
browser.headless=false
browser.timeout.seconds=10

# Test Environment Configuration
test.environment=qa
test.parallel.threads=10
test.retry.count=2